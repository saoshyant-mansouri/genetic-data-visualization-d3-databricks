name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci
      
      # TEMPORARILY DISABLED TO FORCE DEPLOYMENT
      # - name: Run Tests
      #   run: npm test

      - name: Build React App
        run: npm run build
        env:
          VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}

      - name: Deploy to Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GENETIC_VISUALIZATION }}'
          channelId: live
          projectId: genetic-visualization
      # Tell IndexNow (Bing, Yandex, Seznam, Naver, Yep) the live site changed.
      # The key is public by design; a failure here never fails the deploy.
      - name: Submit to IndexNow
        continue-on-error: true
        run: node scripts/indexnow.mjs
        env:
          SITE_URL: https://genetic-visualization.web.app
          INDEXNOW_KEY: aa8de7e34d289e84c39f73292c4f326f
